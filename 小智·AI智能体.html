<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小智 · AI 智能体</title>
<style>
:root{
  --bg:#f4f7fb; --card:#fff; --ink:#1d2433; --sub:#6b7688; --line:#e3e9f2;
  --blue:#3a7afe; --blue-d:#2f63d6; --blue-l:#eaf1ff; --cyan:#5ec8e6;
  --shadow:0 6px 24px rgba(40,70,120,.10); --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);overflow:hidden;font-size:15px;
}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- 顶栏 ---------- */
header{
  display:flex;align-items:center;gap:12px;padding:10px 18px;
  background:linear-gradient(100deg,#e9f2ff 0%,#f3f8ff 45%,#eaf6fb 100%);
  border-bottom:1px solid var(--line);flex:none;
}
.logo{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid #fff;
  box-shadow:0 2px 10px rgba(58,122,254,.25);object-fit:cover;flex:none}
.hname{font-size:16px;font-weight:700;letter-spacing:.3px}
.hsub{font-size:12px;color:var(--sub);margin-top:2px}
.hspace{flex:1}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);
  background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:#c3cbd8;flex:none}
.dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.dot.off{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.16)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;
  padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 主体 ---------- */
main{flex:1;display:flex;min-height:0;gap:0}
#stage{
  width:clamp(400px,34vw,600px);flex:none;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding:12px 12px 58px;
  /* 背景改暖沙：袖子是浅蓝，原来的 #eaf2ff 冷底跟袖子同色系才会糊在一起；
     暖底靠互补色把人物自然顶出来（和原图「暖沙背景 + 蓝白衣」同一思路） */
  background:linear-gradient(168deg,#efe2cf 0%,#f8f1e6 46%,#e6d8c1 100%);
  border-right:1px solid var(--line);overflow:hidden;
}
/* 身后一团柔光，再抬一层分离度 */
#stage::before{content:"";position:absolute;left:50%;top:44%;width:82%;aspect-ratio:1/1.15;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,.32) 58%,rgba(255,255,255,0))}
#pet{width:100%;flex:1;min-height:0;display:block;position:relative;z-index:1;
  /* 两道白描边勾轮廓 + 一层暖色落地投影：纯 GPU 合成，不占 canvas 动画帧 */
  filter:drop-shadow(0 0 2.5px rgba(255,255,255,.99)) drop-shadow(0 0 9px rgba(255,255,255,.95))
         drop-shadow(0 16px 26px rgba(122,90,50,.30))}
#status{
  position:absolute;left:14px;right:14px;bottom:14px;text-align:center;
  font-size:13px;color:#5a6a86;background:rgba(255,255,255,.92);
  border:1px solid #e8dcc6;border-radius:999px;padding:7px 10px;backdrop-filter:blur(4px);
}
#tips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:none;padding:0 0 8px;position:relative;z-index:2}

.tip{font-size:11px;color:#6b7288;background:rgba(255,255,255,.85);border:1px solid #e6dac6;
  border-radius:999px;padding:4px 9px;cursor:pointer;transition:.15s}
.tip:hover{background:#fff;color:var(--blue);border-color:#d9c39a}

#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#list{flex:1;overflow-y:auto;padding:20px 26px 8px;scroll-behavior:smooth}
.row{display:flex;margin-bottom:16px;gap:10px;align-items:flex-start}
.row.me{flex-direction:row-reverse}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:#dfe9f7}
.bub{max-width:min(76%,720px);padding:11px 15px;border-radius:16px;font-size:15px;
  line-height:1.72;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow)}
.row.ai .bub{background:#fff;border-top-left-radius:5px}
.row.me .bub{background:var(--blue);color:#fff;border-top-right-radius:5px;box-shadow:0 4px 14px rgba(58,122,254,.28)}
.bub b{font-weight:700}
.bub code{background:#f1f5fa;padding:1px 6px;border-radius:5px;font-size:13px}
.bub .th{font-size:13px;color:var(--sub);border-left:3px solid #d8e4f6;padding-left:9px;
  margin:0 0 8px;white-space:pre-wrap;line-height:1.6;max-height:120px;overflow:hidden}
.bub img{max-width:180px;border-radius:10px;display:block}
.meta{font-size:11px;color:#98a3b3;margin-top:5px}
.row.me .meta{text-align:right}

/* ---------- 空状态 ---------- */
#empty{padding:34px 26px;text-align:center;color:var(--sub)}
#empty h2{font-size:20px;color:var(--ink);margin:0 0 8px;font-weight:700}
#empty p{font-size:13px;margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px;margin:0 auto}
.chip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 15px;
  font-size:13.5px;cursor:pointer;transition:.16s;box-shadow:0 2px 8px rgba(40,70,120,.05);
  font-family:inherit;color:var(--ink);text-align:left}
.chip:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(58,122,254,.14)}
.chip .ic{margin-right:6px}

/* ---------- 输入栏 ---------- */
#bar{flex:none;padding:10px 22px 18px;background:linear-gradient(180deg,rgba(244,247,251,0),var(--bg))}
#wrap{display:flex;align-items:flex-end;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:26px;padding:8px 10px 8px 12px;box-shadow:var(--shadow);transition:.18s}
#wrap:focus-within{border-color:var(--blue);box-shadow:0 6px 26px rgba(58,122,254,.18)}
#ta{flex:1;border:0;outline:0;resize:none;font-family:inherit;font-size:15px;line-height:1.6;
  max-height:132px;padding:8px 4px;background:transparent;color:var(--ink)}
#ta::placeholder{color:#a8b3c2}
.circ{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;
  font-size:18px;transition:.16s;font-family:inherit}
.circ:hover{border-color:var(--blue);background:var(--blue-l)}
.circ.send{background:var(--blue);border-color:var(--blue);color:#fff}
.circ.send:hover{background:var(--blue-d)}
.circ.send:disabled{background:#c9d6e8;border-color:#c9d6e8;color:#fff;cursor:not-allowed}
.circ.rec{background:#ef4444;border-color:#ef4444;color:#fff;animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
#hint{font-size:11.5px;color:#9aa5b5;text-align:center;margin-top:7px;height:15px}
#hint b{color:var(--blue);font-weight:600}

/* ---------- 设置抽屉 ---------- */
#mask{position:fixed;inset:0;background:rgba(20,30,50,.34);display:none;z-index:50;backdrop-filter:blur(2px)}
#mask.show{display:block}
#setup{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;z-index:51;
  transform:translateX(100%);transition:.26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:-10px 0 40px rgba(30,50,90,.16)}
#setup.show{transform:none}
.sh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  font-size:16px;font-weight:700;flex:none}
.sb{padding:16px 20px;overflow-y:auto;flex:1}
.fg{margin-bottom:17px}
.fg label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:600}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;font-family:inherit;font-size:14px;color:var(--ink);outline:0;background:#fbfcfe}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue);background:#fff}
.fg textarea{resize:vertical;min-height:88px;line-height:1.6;font-size:13px}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.segs{display:flex;gap:7px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:#fbfcfe;border-radius:10px;padding:7px 13px;
  font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);transition:.15s}
.seg.on{background:var(--blue);border-color:var(--blue);color:#fff}
.note{font-size:11.5px;color:#98a3b3;line-height:1.65;margin-top:5px}
.hr{height:1px;background:var(--line);margin:18px 0}
.sf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex:none}
.sw{position:relative;width:44px;height:24px;border-radius:999px;background:#d5dde9;cursor:pointer;
  transition:.2s;flex:none;border:0;padding:0}
.sw.on{background:var(--blue)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sw.on::after{left:22px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  #stage{width:100%;flex:none;height:38vh;border-right:0;border-bottom:1px solid var(--line)}
  main{flex-direction:column}
  #tips{display:none}
  #list{padding:14px 14px 6px}
  .bub{max-width:82%}
  #bar{padding:8px 12px 12px}
}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:#d3dcea;border-radius:9px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#bcc8da}
</style>
</head>
<body>
<div id="app">
  <header>
    <img class="logo" id="logoImg" alt="小智">
    <div>
      <div class="hname">小智</div>
      <div class="hsub">科考站站长 · 你的 AI 伙伴</div>
    </div>
    <div class="hspace"></div>
    <div class="pill"><span class="dot" id="mDot"></span><span id="mTxt">未连接</span></div>
    <button class="btn" id="bNew">＋ 新对话</button>
    <button class="btn" id="bSetup">⚙ 设置</button>
  </header>

  <main>
    <section id="stage">
      <div id="tips"></div>
      <canvas id="pet"></canvas>
      <div id="status">在听，你说～</div>
    </section>

    <section id="chat">
      <div id="list">
        <div id="empty">
          <h2>嗨，我是小智 🛰️</h2>
          <p>科考站站长，也是你的 AI 伙伴。想问什么直接说 —— 打字、说话、发图都行。</p>
        </div>
      </div>
      <div id="bar">
        <div id="wrap">
          <button class="circ" id="bImg" title="发图片（拍题目、拍板书）">📷</button>
          <textarea id="ta" rows="1" placeholder="问我任何问题…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="circ" id="bMic" title="语音提问">🎤</button>
          <button class="circ send" id="bSend" title="发送">➤</button>
        </div>
        <div id="hint"></div>
      </div>
    </section>
  </main>
</div>

<input type="file" id="fileImg" accept="image/*" hidden>

<div id="mask"></div>
<div id="setup">
  <div class="sh"><span style="flex:1">⚙ 设置</span><button class="btn" id="sClose">关闭</button></div>
  <div class="sb">
    <div class="fg">
      <label>DeepSeek API Key</label>
      <input type="password" id="sKey" placeholder="sk-..." autocomplete="off">
      <div class="note">在 platform.deepseek.com/api_keys 创建。Key 只存在本机浏览器，不会上传到任何地方。</div>
    </div>
    <div class="fg">
      <label>接口地址</label>
      <input id="sUrl" value="https://api.deepseek.com/chat/completions">
    </div>
    <div class="fg">
      <label>模型</label>
      <select id="sModel">
        <option value="deepseek-flash">deepseek-flash（V4.1-Flash，快、能看图）</option>
        <option value="deepseek-v4-pro">deepseek-v4-pro（更强，不支持看图）</option>
      </select>
      <div class="note">deepseek-flash 由 DeepSeek-V4.1-Flash 提供服务，1M 上下文，支持图片理解。</div>
    </div>
    <div class="fg">
      <label>回答风格</label>
      <div class="segs" id="sStyle">
        <button class="seg" data-v="chat">像豆包·口语</button>
        <button class="seg" data-v="teacher">老师·讲透</button>
        <button class="seg" data-v="brief">极简·两三句</button>
        <button class="seg" data-v="kid">哄小孩·超通俗</button>
      </div>
    </div>
    <div class="fg">
      <label>深度思考（先推理再回答，更准但更慢）</label>
      <div class="swrow"><span class="note">开启后回答前会思考，速度变慢；关闭则秒回，最接近豆包手感。</span>
        <button class="sw" id="sThink"></button></div>
    </div>
    <div class="hr"></div>
    <div class="fg">
      <label>语音朗读</label>
      <div class="swrow"><span class="note">边生成边按句朗读，回答第一句就会开口。</span>
        <button class="sw on" id="sSpeak"></button></div>
    </div>
    <div class="fg">
      <label>朗读音色</label>
      <select id="sVoice"><option value="">加载中…</option></select>
      <div class="row2" style="margin-top:9px">
        <div><label>语速</label><input type="range" id="sRate" min="0.6" max="1.5" step="0.05" value="1.0"></div>
        <div><label>音高</label><input type="range" id="sPitch" min="0.8" max="1.4" step="0.05" value="1.3"></div>
      </div>
    </div>
    <div class="hr"></div>
    <div class="fg">
      <label>自定义人设（留空则用默认「小智」）</label>
      <textarea id="sSys" placeholder="你是……"></textarea>
    </div>
    <div class="fg"><button class="btn" id="sAdv" style="width:100%">高级选项 ▾</button></div>
    <div id="adv" style="display:none">
      <div class="fg"><label>创造性 temperature（0-1.5）</label>
        <input type="number" id="sTemp" value="0.9" min="0" max="1.5" step="0.05"></div>
      <div class="fg"><label>带入历史轮数</label>
        <input type="number" id="sCtx" value="10" min="0" max="50"></div>
    </div>
  </div>
  <div class="sf">
    <button class="btn" id="sTest" style="flex:1">测试连接</button>
    <button class="btn pri" id="sSave" style="flex:1">保存</button>
  </div>
</div>

/* ================= 小智立绘动画引擎 ================= */
const Pet = (() => {
  /* ============ 小智表演引擎 ============
     动画感来自三件事，缺一不可：
     ① 弹簧而不是线性 lerp —— 有预备、有冲量、有回弹，动作才不会像机械匀速；
     ② 口型跟着「念到哪个字」走（视素时间线，开合 + 圆扁两维），不是正弦抖动；
     ③ 表演事件 —— 重音点头、句末收势、疑问上扬、每隔几秒换一次姿态基线。
     素材限制：眉毛和眼珠是画死的，所以情绪全部走「头颈 + 重心 + 口型 + 眼睑张力」。 */

  function Spr(v, k, z) {
    const d = 2 * Math.sqrt(k) * (z === undefined ? 0.62 : z);
    return {
      x: v, v: 0, t: v, k: k, d: d,
      to(x) { this.t = x; },
      kick(s) { this.v += s; },                       // 冲量：动画里的「预备/回弹」靠它
      step(dt) {
        const a = (this.t - this.x) * this.k - this.v * this.d;
        this.v += a * dt; this.x += this.v * dt;
        return this.x;
      }
    };
  }

  const cv = document.getElementById("pet");
  const ctx = cv.getContext("2d");
  const statusEl = document.getElementById("status");
  const img = { head: new Image(), body: new Image() };
  let ready = false, last = performance.now();
  let state = "idle";                                 // idle | listen | think | speak
  let pin = null;

  /* 通道：刚度 k 越大响应越快，阻尼 z 越小回弹越明显 */
  const headZ = Spr(0, 22, 0.58);                     // 歪头（绕脖子旋转）：欠阻尼，甩过去会稳住
  const headNod = Spr(0, 34, 0.48);                   // 点头（纵向透视压缩 + ≤3.4px 位移）
  const headYaw = Spr(0, 18, 0.72);                   // 转向（scaleX + ≤3px 位移）
  const bodyRot = Spr(0, 8, 0.86);                    // 重心左右（绕脚底微旋，上限 ±1.6°）
  const bodyLean = Spr(0, 12, 0.62);                  // 上身前后倾
  const mouthO = Spr(0, 300, 0.66);                   // 开口度
  const mouthW = Spr(1, 165, 0.80);                   // 嘴宽（圆扁）
  const lid = Spr(0, 18, 0.85);                       // 眼睑张力：思考微眯、强调睁大

  let blink = { t: 1600, p: 0 };
  let pose = { next: 0, z: 0, lean: 0, yaw: 0, sway: 0 };
  let mouthSource = null;                             // 由 Speak 注册：now -> {open,wide,beat}
  let fallback = 0;                                    // 无朗读时的口型目标
  let fallbackW = 1;

  const STATE_TEXT = { idle: "在听，你说～", listen: "我在听…", think: "我想想…", speak: "我说给你听～" };

  let hc = null;                                   // 头层离屏：口型形变要按列取原图像素
  img.head.onload = img.body.onload = () => {
    if (img.head.complete && img.body.complete && img.head.naturalWidth) {
      ready = true; fit(); try { sampleSkin(); } catch (e) { }
      try {
        hc = document.createElement("canvas");
        hc.width = img.head.naturalWidth; hc.height = img.head.naturalHeight;
        hc.getContext("2d").drawImage(img.head, 0, 0);
      } catch (e) { hc = null; }
    }
  };
  img.head.src = ASSET.head; img.body.src = ASSET.body;

  let box = { x: 0, y: 0, w: 0, h: 0, s: 1 };
  function fit() {
    const cw = cv.clientWidth, chh = cv.clientHeight;
    if (cw < 20 || chh < 20) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(chh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pad = 0.95;
    const s = Math.min(cw * pad / PET_C.W, chh * pad / PET_C.H);
    box = { s, w: PET_C.W * s, h: PET_C.H * s, x: (cw - PET_C.W * s) / 2, y: (chh - PET_C.H * s) / 2 };
  }
  new ResizeObserver(() => { if (ready) fit(); }).observe(document.getElementById("stage"));

  const samp = document.createElement("canvas");
  const sctx = samp.getContext("2d", { willReadFrequently: true });
  let skin = "#f3d9c6";
  function sampleSkin() {
    samp.width = PET_C.W; samp.height = PET_C.H;
    sctx.drawImage(img.body, 0, PET_C.BODY.y);
    sctx.drawImage(img.head, 0, PET_C.HEAD.y);
    const pts = [];
    PET_C.EYES.forEach(e => {
      pts.push([e.x + e.rx + 16, e.y - 4], [e.x - e.rx - 16, e.y + 6], [e.x, e.y + e.ry + 14]);
    });
    const mid = (PET_C.EYES[0].x + PET_C.EYES[1].x) / 2;
    pts.push([mid, PET_C.EYES[0].y - 72]);
    let r = 0, g = 0, b = 0, c = 0;
    pts.forEach(pr => {
      const x = Math.round(pr[0]), y = Math.round(pr[1]);
      if (x < 0 || y < 0 || x >= PET_C.W || y >= PET_C.H) return;
      const d = sctx.getImageData(x, y, 1, 1).data;
      if (d[3] < 200) return;
      r += d[0]; g += d[1]; b += d[2]; c++;
    });
    if (c >= 3) skin = "rgb(" + Math.round(r / c) + "," + Math.round(g / c) + "," + Math.round(b / c) + ")";
  }

  function shade(rgb, amt) {
    const m = rgb.match(/\d+/g); if (!m) return rgb;
    const c = m.slice(0, 3).map(v => Math.max(0, Math.min(255, +v + amt)));
    return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
  }

  const PX = PET_C.W / 720;      // 素材像素常量随宽度缩放（旧素材 720 宽标定的值）
  function drawLid(e, k) {
    if (k < 0.02) return;
    const lineY = e.y - e.ry + k * e.ry * 1.55;
    const bulge = lineY + e.ry * 0.42;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(e.x, e.y, e.rx * 1.1, e.ry * 1.12, 0, 0, 6.2832); ctx.clip();
    try { ctx.filter = `blur(${(5.5 * PX).toFixed(1)}px)`; } catch (err) { }
    ctx.beginPath();
    ctx.moveTo(e.x - e.rx * 1.3, e.y - e.ry * 2);
    ctx.lineTo(e.x + e.rx * 1.3, e.y - e.ry * 2);
    ctx.lineTo(e.x + e.rx * 1.3, lineY);
    ctx.quadraticCurveTo(e.x, bulge, e.x - e.rx * 1.3, lineY);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, e.y - e.ry, 0, bulge);
    g.addColorStop(0, shade(skin, -12)); g.addColorStop(0.6, skin); g.addColorStop(1, shade(skin, 4));
    ctx.fillStyle = g; ctx.fill();
    ctx.restore();
    if (k <= 0.34) return;                             // 轻微眯眼只留柔和阴影，不描睫毛线
    ctx.save();
    const a = Math.min(1, (k - 0.34) / 0.5);
    ctx.strokeStyle = "#5e4030"; ctx.lineWidth = (2.2 + 1.6 * a) * PX; ctx.lineCap = "round";
    ctx.globalAlpha = 0.35 + 0.55 * a;
    ctx.beginPath();
    ctx.moveTo(e.x - e.rx * 0.9, lineY - e.ry * 0.06);
    ctx.quadraticCurveTo(e.x, bulge, e.x + e.rx * 0.92, lineY - e.ry * 0.12);
    ctx.stroke();
    if (a > 0.5) {                                     // 快闭到底时才补下睑浅痕
      ctx.globalAlpha = 0.4; ctx.lineWidth = 1.6 * PX;
      ctx.beginPath();
      ctx.moveTo(e.x - e.rx * 0.6, lineY + e.ry * 0.2);
      ctx.quadraticCurveTo(e.x, bulge + e.ry * 0.24, e.x + e.rx * 0.62, lineY + e.ry * 0.14);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---- 口型＝图像形变（不画图形） ----
     位移在嘴线处最大、向下按线性衰减到 0，嘴角处为 0，所以不会撕裂轮廓。
     唇肉/唇线/受光/下巴阴影全是原图像素被平移，因此各视素之间是连续形变。 */
  function mouthLine(x) {                            // 过 L/M/R 三点的抛物线（素材坐标）
    const M = PET_C.MOUTH, a = M.L, b = M.M, c = M.R;
    return a.y * (x - b.x) * (x - c.x) / ((a.x - b.x) * (a.x - c.x))
         + b.y * (x - a.x) * (x - c.x) / ((b.x - a.x) * (b.x - c.x))
         + c.y * (x - a.x) * (x - b.x) / ((c.x - a.x) * (c.x - b.x));
  }
  const BAND_H = 44, ROWS = 18, STEP = 1.5;          // 影响带高 / 条带数 / 列步长（约 800 次切片/帧）
  function drawMouth(o, wid) {
    if (!hc) return;
    const k = Math.min(1.12, Math.max(0, o));
    if (k <= 0.05) return;                           // 闭唇：保持原画微笑，不动像素
    const M = PET_C.MOUTH;
    const Lx = M.L.x, Rx = M.R.x, span = Rx - Lx, cxm = (Lx + Rx) / 2;
    const drop = M.drop * k;
    const wq = Math.max(0.86, Math.min(1.14, wid));
    const band = BAND_H / ROWS;
    const x0 = Lx - 9, x1 = Rx + 9;
    for (let tx = x0; tx <= x1; tx += STEP) {
      const sx = cxm + (tx - cxm) / wq;              // 目标列 → 源列（横向拉伸）
      if (sx < x0 - 3 || sx > x1 + 3) continue;
      const u = (sx - Lx) / span;
      const sh = Math.pow(Math.max(0, Math.sin(Math.PI * Math.max(0, Math.min(1, u)))), 0.5);
      const dy = drop * sh;
      if (dy < 0.5) continue;
      const yl = mouthLine(sx);
      ctx.save();
      ctx.beginPath(); ctx.rect(tx, yl, STEP + 0.55, dy + 1); ctx.clip();
      const g = ctx.createLinearGradient(0, yl, 0, yl + dy);
      g.addColorStop(0, "#4e211f"); g.addColorStop(0.55, "#6d3630"); g.addColorStop(1, "#84473d");
      ctx.fillStyle = g; ctx.fillRect(tx, yl, STEP + 0.55, dy + 1);
      ctx.restore();
      for (let i = ROWS - 1; i >= 0; i--) {          // 从下往上画，新的盖住旧的残留
        const w = 1 - i / ROWS;                      // 顶部位移最大、底部收敛到 0
        const off = dy * w;
        if (off < 0.25) continue;
        const sy = yl + i * band;
        ctx.drawImage(hc, sx, sy, STEP + 0.55, band + 0.45, tx, sy + off, STEP + 0.55, band + 0.45);
      }
    }
    /* 上唇下缘压一条暗线：形变后嘴线位置被拉开，补这条让上唇边界清晰 */
    ctx.save();
    ctx.strokeStyle = "rgba(74,32,30,.55)"; ctx.lineWidth = 1.5 * PX; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(Lx, M.L.y);
    ctx.quadraticCurveTo(cxm + (M.M.x - cxm) / wq, mouthLine(M.M.x) + 0.8, Rx, M.R.y);
    ctx.stroke();
    ctx.restore();

    requestAnimationFrame(frame);
    if (!ready) return;

    const dt = dtms / 1000, T = now / 1000;

    /* ---- 口型来源：优先朗读时间线（逐字视素），否则退回文字节奏 ---- */
    let beat = null;
    if (mouthSource) {
      const sh = mouthSource(now);
      if (sh) {
        mouthO.to(sh.open); mouthW.to(sh.wide);
        if (sh.beat) beat = sh.beat;
      } else { mouthO.to(0); mouthW.to(1); }
    } else {
      mouthO.to(fallback); mouthW.to(fallbackW);
      fallback *= Math.pow(0.02, dt);                  // 时间常数约 0.25s 的指数衰减
    }
    if (beat) api.beat(beat);

    /* ---- 眨眼：说话时略频繁，思考时更少；用 sin 曲线开合而非硬切 ---- */
    blink.t -= dtms;
    if (blink.t <= 0) { blink.p += dtms / 78; if (blink.p >= 1.9) { blink.p = 0;

      blink.t = base + Math.random() * 2600; } }
    const blinkK = blink.p === 0 ? 0 : (blink.p <= 1 ? Math.sin(blink.p * Math.PI) : 0);

    /* ---- 姿态基线：每隔 2.6~4.4 秒换一次，演讲者不会一直一个姿势 ---- */
    if (T > pose.next) {
      pose.next = T + 2.6 + Math.random() * 1.8;
      const amp = state === "speak" ? 1 : 0.45;
      pose.z = (Math.random() * 2 - 1) * 6.8 * amp;
      pose.lean = (Math.random() * 2 - 1) * 2.2 * amp;
      pose.yaw = (Math.random() * 2 - 1) * 2.8 * amp;
      pose.sway = (Math.random() * 2 - 1) * 2.0 * amp;
    }

    const talk = state === "speak";
    headZ.to(pose.z + (state === "listen" ? -5.6 : state === "think" ? 3.4 : 0)
      + (talk ? Math.sin(T * 1.9) * 1.6 : Math.sin(T * 0.42) * 0.8));
    bodyRot.to(Math.max(-1.8, Math.min(1.8, pose.sway * 0.78
      + (talk ? Math.sin(T * 0.9) * 0.8 : Math.sin(T * 0.31) * 0.3))));
    bodyLean.to(pose.lean + (talk ? Math.sin(T * 1.25) * 1.1 : 0));
    headYaw.to(pose.yaw);
    lid.to(state === "think" ? 0.13 : talk ? 0.02 : 0.05);

    headZ.step(dt); headNod.step(dt); headYaw.step(dt);
    bodyRot.step(dt); bodyLean.step(dt);
    mouthO.step(dt); mouthW.step(dt); lid.step(dt);

    if (pin) { mouthO.x = mouthO.v = pin.mouth; mouthW.x = pin.wide || 1; headZ.x = pin.tilt;
               headNod.x = pin.nod || 0; headYaw.x = pin.yaw || 0; bodyRot.x = pin.lean || 0; }
    const bk = pin ? (pin.blink || 0) : Math.max(blinkK, Math.max(0, lid.x));

    const breathe = Math.sin(T * 2 * Math.PI / 2.6);
    const bob = breathe * 2.8 * box.s + (talk ? Math.abs(Math.sin(T * 3.1)) * 2.6 * box.s : 0);
    const o = Math.max(0, mouthO.x), wid = Math.max(0.55, mouthW.x);

    // 远小于头身层 66px 的羽化重叠带，所以不会露缝、也不会像头从脖子上掉下去
    const nodY = Math.max(-8, Math.min(8, headNod.x * 8.5));
    const yawX = Math.max(-4, Math.min(4, headYaw.x * 1.4));
    const fx = PET_C.W / 2, fy = PET_C.H - 8;

    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.save();
    ctx.translate(box.x, box.y + bob);
    ctx.scale(box.s, box.s);
    ctx.translate(fx, fy); ctx.rotate(bodyRot.x * Math.PI / 180);
    ctx.scale(1, 1 - Math.abs(bodyLean.x) * 0.0035); ctx.translate(-fx, -fy);
    ctx.drawImage(img.body, 0, PET_C.BODY.y - PET_C.HEAD.y);

    ctx.save();
    ctx.translate(PET_C.PIVOT.x, PET_C.PIVOT.y);
    ctx.rotate(headZ.x * Math.PI / 180);               // 头只绕脖子转，不平移
    ctx.translate(yawX, nodY);
    ctx.scale(1 - Math.abs(headYaw.x) * 0.004, 1 - Math.abs(nodY) * 0.0042);
    ctx.translate(-PET_C.PIVOT.x, -PET_C.PIVOT.y);
    ctx.drawImage(img.head, 0, 0);
    drawMouth(o, wid);
    drawLid(PET_C.EYES[0], bk); drawLid(PET_C.EYES[1], bk);
    ctx.restore();
    ctx.restore();
  }
  requestAnimationFrame(frame);

  const api = {
    setState(s) { state = s; statusEl.textContent = STATE_TEXT[s] || STATE_TEXT.idle; },
    /* 兼容旧接口：无朗读时由文字节奏喂，附带当前字以决定嘴形 */
    say(level, ch) {
      fallback = Math.max(fallback, level);
      if (ch) { const v = (window.viseme && window.viseme(ch)) || null; if (v) fallbackW = v.w; }
      if (state !== "speak") this.setState("speak");
    },
    stopSay() { this.setState("idle"); fallback = 0; },
    setMouthSource(fn) { mouthSource = fn; },
    /* 表演事件：给弹簧冲量，让身体自己「弹」出动作，而不是硬设角度 */
    beat(kind) {
      if (kind === "nod") { headNod.kick(5.2); bodyLean.kick(2.2); }
      else if (kind === "emph") { headNod.kick(3.6); headZ.kick(9); mouthO.kick(0.2); }
      else if (kind === "rise") { headNod.kick(-4.0); headZ.kick(-4.5); lid.to(0); }
      else if (kind === "tilt") { headZ.kick(7); }
      else if (kind === "breath") { bodyLean.kick(-2.8); headNod.kick(-2.2); }
      else if (kind === "settle") { headZ.kick(-headZ.v * 0.6); headNod.kick(-headNod.v * 0.7); }
    },
    pin(o) { pin = o || null; },
    get mouth() { return mouthO.x; }, get tilt() { return headZ.x; },
    get nod() { return headNod.x; }, get lean() { return bodyRot.x; },
    get state() { return state; },
  };
  return api;
})();
if (/[?&]debug=1/.test(location.search)) window.Pet = Pet;   // 仅调试模式暴露，供定格截图

/* ================= DeepSeek 流式客户端 ================= */
async function callDeepSeek(history, onDelta, onReason, signal) {
  const body = {
    model: CFG.model, messages: history, stream: true,
    temperature: +CFG.temp, max_tokens: 2000,
    thinking: { type: CFG.think ? "enabled" : "disabled" },
  };
  if (CFG.think) body.reasoning_effort = "high";
  const res = await fetch(CFG.url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + CFG.key },
    body: JSON.stringify(body), signal,
  });
  if (!res.ok) {
    let t = ""; try { t = await res.text(); } catch (e) { }
    let msg = t; try { msg = JSON.parse(t).error?.message || t; } catch (e) { }
    throw new Error(`HTTP ${res.status} ${msg}`.slice(0, 200));
  }
  const rd = res.body.getReader(), dec = new TextDecoder();
  let buf = "", got = 0;
  while (true) {
    const { done, value } = await rd.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const raw of lines) {
      const line = raw.trim();
      if (!line || line.startsWith(":") || !line.startsWith("data:")) continue;
      const d = line.slice(5).trim();
      if (d === "[DONE]") continue;
      let j; try { j = JSON.parse(d); } catch (e) { continue; }
      const dl = (j.choices && j.choices[0] && j.choices[0].delta) || {};
      if (dl.reasoning_content) onReason(dl.reasoning_content);
      if (dl.content) { got += dl.content.length; onDelta(dl.content); }
    }
  }
  if (!got) throw new Error("模型没有返回内容");
}

  }
  window.viseme = viseme;

  const EMPH = /很|最|非常|一定|其实|你看|比如|当然|特别|就是|记住|重要|其实|首先|然后|最后|为什么/g;
  /* 一句朗读 → 帧序列（每字一个口形）+ 表演事件（重音、句读、收势） */
  function buildTimeline(text, rate) {
    const per = 208 / Math.max(0.6, +rate || 1);
    const frames = [], events = [];
    let t = 0;
    for (const ch of text) {
      const v = viseme(ch);
      const d = v.pz || per;
      frames.push({ t0: t, d: d, o: v.o, w: v.w });
      if ("，、；:".indexOf(ch) >= 0) events.push({ at: t, kind: "nod" });
      else if (ch === "？" || ch === "?") events.push({ at: t, kind: "rise" });   // 疑问：抬头上扬
      else if ("。！".indexOf(ch) >= 0) events.push({ at: t, kind: "settle" });   // 陈述：收势
      t += d;
    }
    let lastE = -999;
    const src = text;
    EMPH.lastIndex = 0;
    let m;
    while ((m = EMPH.exec(src)) !== null) {
      const at = m.index * per;
      if (at - lastE > 900) { events.push({ at: at, kind: "emph" }); lastE = at; }
    }
    events.sort((a, b) => a.at - b.at);
    return { frames: frames, events: events, len: t };
  }

  /* Pet 每帧向这里取「此刻该做什么口形、触发什么动作」 */
  function source(now) {
    if (!playing) return null;
    const ms = now - playing.t0;
    if (ms >= playing.len) return { open: 0, wide: 1, beat: null };
    const fr = playing.frames;
    while (playing.i < fr.length && fr[playing.i].t0 + fr[playing.i].d <= ms) playing.i++;
    const f = fr[Math.min(playing.i, fr.length - 1)];
    let beat = null;
    while (playing.ei < playing.events.length && playing.events[playing.ei].at <= ms) {
      beat = playing.events[playing.ei].kind; playing.ei++;
    }
    return { open: f.o, wide: f.w, beat: beat };
  }
  function hook() { if (!hooked) { hooked = true; Pet.setMouthSource(source); } }
  function unhook() { if (hooked) { hooked = false; Pet.setMouthSource(null); } }

  function one(item) {
    const u = new SpeechSynthesisUtterance(item.text);
    u.lang = "zh-CN"; u.rate = +CFG.rate; u.pitch = +CFG.pitch;
    const v = voices.find(x => x.name === CFG.voice); if (v) u.voice = v;
    playing = { frames: item.tl.frames, events: item.tl.events, len: item.tl.len,
                t0: performance.now(), i: 0, ei: 0 };
    Pet.beat("breath");
    u.onend = u.onerror = () => {
      speaking = false; playing = null; active = Math.max(0, active - 1);
      if (!active) unhook();
      next();
    };
    speaking = true; speechSynthesis.speak(u);
  }
  function next() { if (speaking || !queue.length) return; one(queue.shift()); }

  return {
    feed(sent) {
      if (!CFG.speak || !window.speechSynthesis) return;
      const text = typeof sent === "string" ? sent : "";
      if (!text.trim()) return;
      queue.push({ text: text, tl: buildTimeline(text, CFG.rate) });
      active++; hook(); next();
    },
    flush(rest) { if (rest && rest.trim()) this.feed(plain(rest)); },
    stop() {
      queue = []; active = 0; playing = null; unhook();
      if (window.speechSynthesis) speechSynthesis.cancel();
      speaking = false;
    },
    idle() { return active === 0 && !speaking && !queue.length; },
    onIdle(cb) { const t = setInterval(() => { if (this.idle()) { clearInterval(t); cb(); } }, 220); },
    refresh: pick, hasVoice: () => voices.length > 0,
    debug() { return { active: active, queue: queue.length, speaking: speaking, hooked: hooked }; },
  };
})();
</script>
<script>
/* ================= 打字机平滑层 =================
   实测 DeepSeek flash 会成批吐字（可达 160 字/秒、块间隔中位 0ms），直接上屏会
   "一屏刷出来"，口型也会被高频回调顶成常张不动。这里把到达的字符入队，按自适应
   速率逐帧释放，让文字、口型、朗读三者节奏一致。 */
const Typer = (() => {
  let q = "", shown = "", ended = false, sink = null, raf = 0, last = 0, acc = 0, waiters = [], fast = false;
  const BASE = 20, CATCH = 42, CAP = 46;        // 字/秒：舒适口语速度 / 收尾提速 / 硬上限
  function settle() { if (!q && ended) { raf = 0; const w = waiters; waiters = []; w.forEach(f => f()); return true; } return false; }
  function emit(cnt) {
    const added = q.slice(0, cnt); q = q.slice(cnt); shown += added;
    if (sink) sink(shown, added);
  }
  function tick(ts) {
    if (!last) last = ts;
    const dt = Math.min(0.1, (ts - last) / 1000); last = ts;
    if (q) {
      let rate = BASE + Math.max(0, q.length - 45) * 0.5;   // 积压只小幅追赶，保住逐字感
      if (ended) rate = Math.max(rate, CATCH);
      acc += Math.min(rate, CAP) * dt;
      const cnt = Math.floor(acc);
      if (cnt > 0) { acc -= cnt; emit(Math.min(cnt, q.length)); }
    }
    if (settle()) return;
    raf = requestAnimationFrame(tick);
  }
  return {
    start(fn) {
      if (raf) cancelAnimationFrame(raf);
      sink = fn; q = ""; shown = ""; ended = false; acc = 0; last = 0; waiters = []; fast = false;
      raf = requestAnimationFrame(tick);
    },
    push(c) { if (fast) { shown += c; if (sink) sink(shown, c); return; } q += c; },
    burst() { fast = true; if (q) emit(q.length); },          // 立即放到末尾，后续到达即到
    end() { ended = true; if (!q) settle(); },
    flush() { if (q) emit(q.length); },                     // 停止/出错时立即全部上屏
    idle() { return new Promise(r => { if (ended && !q) r(); else waiters.push(r); }); },
    get text() { return shown; },

  };
})();

/* ================= 气泡渲染 ================= */
const AV = () => ASSET.avatar;
function atBottom() { return list.scrollHeight - list.scrollTop - list.clientHeight < 120; }
function toBottom(force) { if (force || atBottom()) list.scrollTop = list.scrollHeight; }

function addRow(role, html) {
  const d = document.createElement("div");
  d.className = "row " + (role === "me" ? "me" : "ai");
  d.innerHTML = `<img class="av" src="${AV()}"><div class="bub">${html}</div>`;
  list.appendChild(d);
  return d.querySelector(".bub");
}
function addUser(text, img) {
  $("#empty") && $("#empty").remove();
  const b = addRow("me", (img ? `<img src="${img}"><div style="margin-top:6px">` : "") +
    (esc(text) || (img ? "（图片）" : "")) + (img ? "</div>" : ""));
  const m = document.createElement("div"); m.className = "meta";
  m.textContent = new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  b.parentElement.appendChild(m);
  toBottom(true);
}
function newAiBubble() {
  const b = addRow("ai", `<span class="th" style="display:none"></span><span class="bd"></span><span class="cur">▌</span>`);
  b.title = "点一下：立即显示全部";
  b.onclick = () => { if (busy) Typer.burst(); };
  toBottom(true);
  return { bub: b, bd: b.querySelector(".bd"), th: b.querySelector(".th"), cur: b.querySelector(".cur") };
}

/* ================= 发送与流式接收 ================= */
async function send(text, img) {
  if (busy) return;
  if (!CFG.key) { openSetup(); setModel(false, "请先填 API Key"); return; }
  text = (text || "").trim();
  if (!text && !img) return;

  const content = img
    ? [{ type: "text", text: text || "看看这张图，说说你的想法。" },
       { type: "image_url", image_url: { url: img } }]
    : text;
  msgs.push({ role: "user", content });
  addUser(text, img);

  busy = true; aborter = new AbortController();
  uiBusy(true);
  Pet.setState("think");
  const B = newAiBubble();
  let full = "", think = "", pend = "", tStart = 0;

  const hist = [{ role: "system", content: SYS() }];
  const keep = Math.max(0, +CFG.ctx) * 2;
  msgs.slice(-keep).forEach(m => hist.push(m));

  /* 上屏回调：文字、口型、朗读都在这一条节奏里驱动 */
  Typer.start((shownAll, added) => {
    B.bd.innerHTML = md(shownAll);
    if (added) {
      for (const ch of added) {
        pend += ch;
        if (/[。！？!?；;\n]/.test(ch)) {
          const sp = plain(pend); if (sp.length > 1) Speak.feed(sp);
          pend = "";
        }
      }
      // 没开朗读时口型跟文字节奏；开了朗读交给 Speak 的音节包络
      if (!CFG.speak || !window.speechSynthesis)
        Pet.say(Math.min(1, 0.3 + added.length * 0.16 + Math.random() * 0.14),
                added[added.length - 1]);
    }
    toBottom();
  });

  const onDelta = chunk => {
    if (!tStart) { tStart = performance.now(); Pet.setState("speak"); }
    full += chunk;
    Typer.push(chunk);
  };
  const onReason = chunk => {
    think += chunk;
    B.th.style.display = "";
    B.th.textContent = "💭 " + think.slice(-260);
  };

  try {
    await callDeepSeek(hist, onDelta, onReason, aborter.signal);
    Typer.end();
    await Typer.idle();                      // 等队列放完再收尾，避免最后几句被截断
    if (pend) { const s = plain(pend); if (s.length > 1) Speak.feed(s); pend = ""; }
    msgs.push({ role: "assistant", content: full });
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = `${CFG.model} · ${((performance.now() - tStart) / 1000).toFixed(1)}s`;
    B.bub.appendChild(m);
    setModel(true, CFG.model === "deepseek-flash" ? "V4.1-Flash 在线" : "V4-Pro 在线");
  } catch (err) {
    Typer.end(); Typer.flush(); await Typer.idle();   // 已到达的内容全部显示出来
    if (err.name === "AbortError") {
      if (full) msgs.push({ role: "assistant", content: full });
      B.bd.innerHTML = md(Typer.text + (Typer.text ? "\n\n" : "") + "（已停止）");
    } else {
      Speak.stop();
      B.bd.innerHTML = (Typer.text ? md(Typer.text) : "") +
        `<span style="color:#d33">出错了：</span>` + esc(String(err.message || err)) +
        `<div style="font-size:12.5px;color:#8a94a3;margin-top:6px">检查网络、Key 是否有效、余额是否充足。</div>`;
      setModel(false, "连接失败");
    }
  } finally {
    busy = false; aborter = null; uiBusy(false);
    B.cur.remove();
    if (Speak.idle()) Pet.stopSay(); else Speak.onIdle(() => { if (!busy) Pet.stopSay(); });
    toBottom();
  }
}
function watchSpeakEnd() {
  const tick = setInterval(() => {
    if (!window.speechSynthesis || !speechSynthesis.speaking) { clearInterval(tick); if (!busy) Pet.stopSay(); }
  }, 260);
}
function uiBusy(on) {
  $("#bSend").textContent = on ? "⏹" : "➤";
  $("#bSend").title = on ? "停止生成" : "发送";
  $("#hint").innerHTML = on ? "正在回答 · 点气泡可跳到末尾，点 ⏹ 停止" : hintDefault();
}
function hintDefault() {
  if (!CFG.key) return "点右上角 <b>⚙ 设置</b> 填入 DeepSeek API Key 即可开聊";
  return CFG.speak ? "🎤 按住说话 · Enter 发送 · Shift+Enter 换行" : "Enter 发送 · Shift+Enter 换行";
}
</script>
<script>
/* ================= 语音输入（Edge / Chrome 的 Web Speech） ================= */
const Rec = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = "zh-CN"; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
  let live = false, fin = "", onEnd = null, idleT = null;
  const mic = () => document.getElementById("bMic");
  r.onstart = () => { live = true; mic().classList.add("rec"); Pet.setState("listen"); setHint("🎙 说出你的问题，说完停一下会自动发送…"); };
  r.onresult = e => {
    let it = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const x = e.results[i];
      if (x.isFinal) fin += x[0].transcript; else it += x[0].transcript;
    }
    ta.value = (fin + it).trim();
    grow();
    clearTimeout(idleT);
    if (fin.trim()) idleT = setTimeout(stop, 1600);       // 停顿即自动提交
  };
  r.onerror = ev => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed")
      setHint("麦克风被拒绝：点地址栏🔒允许后重试，或改用打字");
    else if (ev.error !== "aborted" && ev.error !== "no-speech") setHint("语音识别出错：" + ev.error);
    stop();
  };
  r.onend = () => {
    live = false; mic().classList.remove("rec");
    clearTimeout(idleT);
    const t = fin.trim(); fin = "";
    if (onEnd) { const f = onEnd; onEnd = null; f(t); }
    else if (t && !busy) send(t);
    if (!busy) Pet.stopSay();
    setHint(hintDefault());
  };
  function stop() { try { r.stop(); } catch (e) { } }
  return {
    start(cb) { fin = ""; onEnd = cb || null; try { r.start(); } catch (e) { } },
    stop, get on() { return live; }, ok: true,
  };
})();

function setHint(h) { $("#hint").innerHTML = h; }

/* ================= 图片输入 ================= */
let pendImg = null;
function shrink(file, cb) {
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const M = 1024, sc = Math.min(1, M / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", 0.86));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function showImg() {
  let p = $("#imgPrev");
  if (!pendImg) { if (p) p.remove(); return; }
  if (!p) {
    p = document.createElement("div"); p.id = "imgPrev";
    p.style.cssText = "display:flex;align-items:center;gap:8px;padding:6px 2px 8px";
    $("#bar").insertBefore(p, $("#wrap"));
  }
  p.innerHTML = `<img src="${pendImg}" style="height:46px;border-radius:8px;border:1px solid var(--line)">
    <span style="font-size:12px;color:var(--sub)">已附图，将随问题一起发送</span>
    <button class="btn" style="padding:4px 10px;font-size:12px" id="imgX">移除</button>`;
  $("#imgX").onclick = () => { pendImg = null; showImg(); };
}
</script>
<script>
/* ================= 设置面板 ================= */
function openSetup() { $("#mask").classList.add("show"); $("#setup").classList.add("show"); fillSetup(); }
function closeSetup() { $("#mask").classList.remove("show"); $("#setup").classList.remove("show"); }
function fillSetup() {
  $("#sKey").value = CFG.key; $("#sUrl").value = CFG.url; $("#sModel").value = CFG.model;
  $("#sSys").value = CFG.sys; $("#sTemp").value = CFG.temp; $("#sCtx").value = CFG.ctx;
  $("#sRate").value = CFG.rate; $("#sPitch").value = CFG.pitch;
  $("#sThink").classList.toggle("on", !!CFG.think);
  $("#sSpeak").classList.toggle("on", !!CFG.speak);
  document.querySelectorAll("#sStyle .seg").forEach(b => b.classList.toggle("on", b.dataset.v === CFG.style));
  if (window.speechSynthesis) Speak.refresh();
}
async function testKey() {
  const k = $("#sKey").value.trim();
  if (!k) { alert("先填 Key"); return; }
  $("#sTest").textContent = "测试中…"; $("#sTest").disabled = true;
  try {
    const r = await fetch($("#sUrl").value.trim(), {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + k },
      body: JSON.stringify({ model: $("#sModel").value, messages: [{ role: "user", content: "说“通”一个字" }], max_tokens: 8, stream: false }),
    });
    const j = await r.json();
    if (r.ok) { $("#sTest").textContent = "✓ 连接成功"; setModel(true, "连接正常"); }
    else { $("#sTest").textContent = "✗ 失败"; alert("失败：" + ((j.error && j.error.message) || r.status)); setModel(false, "Key 无效"); }
  } catch (e) { $("#sTest").textContent = "✗ 网络不通"; alert("网络错误：" + e.message); }
  $("#sTest").disabled = false; setTimeout(() => $("#sTest").textContent = "测试连接", 2600);
}
function bindSetup() {
  $("#bSetup").onclick = openSetup;
  $("#sClose").onclick = closeSetup; $("#mask").onclick = closeSetup;
  $("#sTest").onclick = testKey;
  $("#sAdv").onclick = () => {
    const a = $("#adv"); a.style.display = a.style.display === "none" ? "" : "none";
  };
  document.querySelectorAll("#sStyle .seg").forEach(b => b.onclick = () => {
    CFG.style = b.dataset.v;
    document.querySelectorAll("#sStyle .seg").forEach(x => x.classList.toggle("on", x === b));
    saveCfg();
  });
  $("#sThink").onclick = e => { CFG.think = !CFG.think; e.target.classList.toggle("on", CFG.think); saveCfg(); };
  $("#sSpeak").onclick = e => {
    CFG.speak = !CFG.speak; e.target.classList.toggle("on", CFG.speak);
    if (!CFG.speak) Speak.stop(); saveCfg(); setHint(hintDefault());
  };
  $("#sSave").onclick = () => {
    CFG.key = $("#sKey").value.trim(); CFG.url = $("#sUrl").value.trim() || DEF.url;
    CFG.model = $("#sModel").value; CFG.sys = $("#sSys").value;
    CFG.temp = +$("#sTemp").value || 0.9; CFG.ctx = Math.max(0, +$("#sCtx").value || 0);
    CFG.rate = +$("#sRate").value; CFG.pitch = +$("#sPitch").value;
    CFG.voice = $("#sVoice").value;
    saveCfg(); refreshDot(); setHint(hintDefault()); closeSetup();
  };
  $("#sVoice").onchange = e => { CFG.voice = e.target.value; saveCfg(); };
}

/* ================= 交互绑定 ================= */
function grow() { ta.style.height = "auto"; ta.style.height = Math.min(132, ta.scrollHeight) + "px"; }
function submit() {
  const t = ta.value.trim(); if (!t && !pendImg) return;
  ta.value = ""; grow(); const im = pendImg; pendImg = null; showImg(); send(t, im);
}
function bindUI() {
  ta.oninput = grow;
  ta.onkeydown = e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  };
  $("#bSend").onclick = () => { if (busy) { if (aborter) aborter.abort(); Speak.stop(); } else submit(); };
  $("#bMic").onclick = () => {
    if (!Rec) { setHint("这个浏览器不支持语音识别，请改用 <b>Edge</b> 或 Chrome"); return; }
    if (Rec.on) { Rec.stop(); return; }
    if (busy) { setHint("等小智说完再录，或先点 ⏹ 停止"); return; }
    const pre = ta.value.trim();
    Rec.start(t => {
      const q = (pre ? pre + " " : "") + (t || "");
      ta.value = q.trim(); grow();
      if (q.trim()) submit();
    });
  };
  $("#bImg").onclick = () => {
    if (CFG.model === "deepseek-v4-pro") { setHint("V4-Pro 不支持看图，切到 <b>deepseek-flash</b> 再发图"); return; }
    $("#fileImg").click();
  };
  $("#fileImg").onchange = e => { const f = e.target.files[0]; if (f) shrink(f, d => { pendImg = d; showImg(); }); e.target.value = ""; };
  $("#bNew").onclick = () => {
    Speak.stop(); msgs = []; list.innerHTML = "";
    list.innerHTML = `<div id="empty"><h2>新对话</h2><p>刚才的聊过就忘了，重新开始。</p></div>`;
    buildChips(); Pet.stopSay();
  };
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSetup(); });
}

/* ================= 开场话题 ================= */
const TOPICS = [
  ["🌏", "给我讲个冷知识"], ["🍚", "晚饭吃什么，帮我选"], ["✍️", "帮我把这段话改通顺"],
  ["🧮", "用生活例子解释负数"], ["🤖", "AI 能帮老师做哪些事"], ["🏔", "为什么山上比山下冷"],
];
function buildChips() {
  const tp = document.getElementById("tips");
  tp.innerHTML = TOPICS.slice(0, 3).map(([ic, t], i) => `<span class="tip" data-i="${i}">${ic}${t.slice(0, 8)}…</span>`).join("");
  tp.querySelectorAll(".tip").forEach(b => b.onclick = () => send(TOPICS[+b.dataset.i][1]));
}

/* ================= 启动 ================= */
$("#logoImg").src = ASSET.avatar;
refreshDot(); setHint(hintDefault()); bindSetup(); bindUI(); buildChips();
</script>
</body>
